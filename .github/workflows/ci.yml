name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbformat pyyaml

      - name: Validate notebooks and Docker config
        run: python scripts/validate_repo.py

      - name: Validate Docker Compose file
        run: docker compose -f docker/docker-compose.yml config >/tmp/docker-compose-check.txt
